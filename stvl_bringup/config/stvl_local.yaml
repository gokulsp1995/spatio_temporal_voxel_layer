# Local costmap: STVL only, rolling 8 x 8 m window in odom (no static map).
# Same HEIGHT RULE as stvl_global.yaml. Values assume a STANDING KISS-ICP start
# (floor at z = -0.504 in odom). Recompute if you start in another stance.
/**:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 8
    height: 8
    resolution: 0.05
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.5
    footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"   # placeholder
    plugins: ["stvl_layer"]

    stvl_layer:
      plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
      enabled: true
      voxel_decay: 10.0            # README: 5-15 s for a local costmap
      decay_model: 0
      voxel_size: 0.05
      track_unknown_space: true
      mark_threshold: 0
      update_footprint_enabled: true
      combination_method: 1
      origin_z: 0.0
      publish_voxel_map: true
      transform_tolerance: 0.5
      mapping_mode: false
      observation_sources: lidar_mark lidar_clear
      lidar_mark:
        data_type: PointCloud2
        topic: /livox/lidar
        marking: true
        clearing: false
        obstacle_range: 4.0
        min_obstacle_height: -0.204
        max_obstacle_height: 1.496
        expected_update_rate: 0.0
        observation_persistence: 0.0
        inf_is_valid: false
        clear_after_reading: true
        filter: "voxel"
        voxel_min_points: 0
      lidar_clear:
        enabled: true
        data_type: PointCloud2
        topic: /livox/lidar
        marking: false
        clearing: true
        model_type: 1
        min_z: 0.3
        max_z: 8.0
        vertical_fov_angle: 0.244
        horizontal_fov_angle: 6.29
        decay_acceleration: 5.0