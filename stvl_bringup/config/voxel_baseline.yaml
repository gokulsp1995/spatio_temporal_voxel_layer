# Baseline for the comparison: Nav2 VoxelLayer, matched to stvl_local.yaml
# (same window, resolution, rates, sensor, height band). Only the plugin differs.
# Standing KISS-ICP start: floor at z = -0.504 in odom.
/**:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 8
    height: 8
    resolution: 0.05
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.5
    footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"   # placeholder
    plugins: ["voxel_layer"]

    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      publish_voxel_map: true
      origin_z: -0.504          # voxel column starts at the floor
      z_resolution: 0.125
      z_voxels: 16              # 16 x 0.125 = 2.0 m; 16 is believed to be the maximum, verify
      mark_threshold: 0
      combination_method: 1
      observation_sources: lidar
      lidar:
        topic: /livox/lidar
        data_type: PointCloud2
        marking: true
        clearing: true
        min_obstacle_height: -0.204
        max_obstacle_height: 1.496
        obstacle_max_range: 4.0
        obstacle_min_range: 0.0
        raytrace_max_range: 8.0
        raytrace_min_range: 0.0
        inf_is_valid: false