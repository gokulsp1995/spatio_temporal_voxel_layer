/**:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    rolling_window: false
    track_unknown_space: true
    always_send_full_costmap: true
    resolution: 0.05
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.5
    footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"
    plugins: ["static_layer", "stvl_layer", "inflation_layer"]

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: /map
      map_subscribe_transient_local: true

    stvl_layer:
      plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
      enabled: true
      voxel_decay: 20.0
      decay_model: 0
      voxel_size: 0.05
      track_unknown_space: true
      mark_threshold: 0
      update_footprint_enabled: true
      combination_method: 1
      origin_z: 0.0
      publish_voxel_map: true
      transform_tolerance: 0.5
      mapping_mode: false
      observation_sources: lidar_mark lidar_clear
      lidar_mark:
        data_type: PointCloud2
        topic: /livox/lidar
        marking: true
        clearing: false
        obstacle_range: 4.0
        min_obstacle_height: 0.3
        max_obstacle_height: 2.0
        expected_update_rate: 0.0
        observation_persistence: 0.0
        inf_is_valid: false
        clear_after_reading: true
        filter: "voxel"
        voxel_min_points: 0
      lidar_clear:
        enabled: true
        data_type: PointCloud2
        topic: /livox/lidar
        marking: false
        clearing: true
        model_type: 1
        min_z: 0.3
        max_z: 8.0
        vertical_fov_angle: 0.244
        horizontal_fov_angle: 6.29
        decay_acceleration: 5.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.55
      cost_scaling_factor: 3.0