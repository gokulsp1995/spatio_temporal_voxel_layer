# Global costmap: live STVL obstacles on top of the static .pgm, in the map frame.
#
# HEIGHT RULE (odom starts at base_link's height when KISS-ICP starts):
#   H_start = floor-to-lidar-centre height in the stance KISS-ICP starts in
#   floor_z = -(H_start - 0.291)          # 0.291 = lidar above base_link (URDF)
#   min_obstacle_height = floor_z + 0.3
#   max_obstacle_height = floor_z + 2.0
# Values below assume a STANDING start: H_start = 0.795 -> floor_z = -0.504.
# If you start sitting, measure H_start and recompute. Never change stance mid-test.
/**:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    rolling_window: false          # grid takes the .pgm's size from the static layer
    track_unknown_space: true
    always_send_full_costmap: true
    resolution: 0.05
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.5
    footprint: "[[0.4, 0.25], [0.4, -0.25], [-0.4, -0.25], [-0.4, 0.25]]"   # placeholder: use the real A2-W outline
    plugins: ["static_layer", "stvl_layer"]   # add "inflation_layer" after the evaluation

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_topic: /map
      map_subscribe_transient_local: true

    stvl_layer:
      plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
      enabled: true
      voxel_decay: 20.0            # README: 15-45 s for a global costmap
      decay_model: 0               # 0 = linear
      voxel_size: 0.05
      track_unknown_space: true
      mark_threshold: 0
      update_footprint_enabled: true
      combination_method: 1
      origin_z: 0.0                # meaning not verified in the jazzy source, leave at 0
      publish_voxel_map: true
      transform_tolerance: 0.5
      mapping_mode: false
      observation_sources: lidar_mark lidar_clear
      lidar_mark:
        data_type: PointCloud2
        topic: /livox/lidar
        marking: true
        clearing: false
        obstacle_range: 4.0
        min_obstacle_height: -0.204    # floor + 0.3 m (standing start)
        max_obstacle_height: 1.496     # floor + 2.0 m (standing start)
        expected_update_rate: 0.0
        observation_persistence: 0.0
        inf_is_valid: false
        clear_after_reading: true
        filter: "voxel"
        voxel_min_points: 0
      lidar_clear:
        enabled: true
        data_type: PointCloud2
        topic: /livox/lidar
        marking: false
        clearing: true
        model_type: 1                  # 3D lidar
        min_z: 0.3
        max_z: 8.0
        vertical_fov_angle: 0.244      # +/-7 deg IF the code treats this as the total angle: verify
        horizontal_fov_angle: 6.29
        decay_acceleration: 5.0        # sweep 0, 1, 2, 5 in the benchmark

    inflation_layer:                   # defined but unused until listed in plugins
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.35
      cost_scaling_factor: 8.0